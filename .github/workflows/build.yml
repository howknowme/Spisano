name: Build Catedra
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - run: npm ci
      - run: npm run dist:win
      - run: npm run dist:linux
      - run: npm run build:html
      # APK-ul de aici este nesemnat (pentru semnare, puneți keystore-ul în secretele depozitului).
      - run: node scripts/build-single.js www/index.html && npx cap sync android && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Catedra
          path: |
            dist/Catedra-Setup-*.exe
            dist/catedra_*_amd64.deb
            Catedra.html
            android/app/build/outputs/apk/debug/*.apk
